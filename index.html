<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Coverage - Tối Ưu Phân Cấp</title>
    
    <!-- Thư viện chuyên dụng -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root {
            --bg-dark: #1E2227;
            --bg-panel: #282C34;
            --color-primary: #7D3F20;
            --color-secondary: #A86134;
            --color-accent: #D3885D;
            --color-light-1: #E8B892;
            --color-light-2: #F9E3C9;
            --text-main: #E2E8F0;
            --text-muted: #9CA3AF;
            --border-color: #3F4451;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            font-size: 13px;
            overflow: hidden;
        }

        #app-container { display: flex; height: 100vh; width: 100%; }
        
        /* 70% Báo cáo bên trái */
        #report-panel { 
            width: 70%; height: 100%; 
            display: flex; flex-direction: column; 
            padding: 20px; box-sizing: border-box;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-section h2 { margin: 0; color: var(--color-light-1); font-size: 18px; }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-item label { font-size: 11px; color: var(--text-muted); font-weight: bold; }

        select {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }

        .btn-primary { 
            padding: 10px 16px; background-color: var(--color-secondary); 
            color: var(--color-light-2); border: none; border-radius: 6px; 
            font-weight: bold; cursor: pointer; transition: background 0.3s;
            height: 36px; margin-top: 15px;
        }
        .btn-primary:hover { background-color: var(--color-primary); }
        .btn-primary:disabled { background-color: #4B5563; color: var(--text-muted); cursor: not-allowed; }

        #table-container { 
            flex-grow: 1; overflow-y: auto; 
            background: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
        
        th { 
            background-color: var(--color-primary); 
            color: var(--color-light-2); 
            position: sticky; top: 0; z-index: 2; 
            font-size: 11px; text-transform: uppercase;
        }

        tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .num-right { text-align: right; font-weight: bold; }
        .text-green { color: #10B981; }
        .text-orange { color: var(--color-accent); }

        /* 30% Bản đồ bên phải */
        #map-panel { width: 30%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #1A1D24; }
        
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }
        .leaflet-popup-tip { background: var(--bg-panel) !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="report-panel">
        <div class="header-section">
            <h2>📊 BÁO CÁO COVERAGE PHÂN CẤP THỊ TRƯỜNG</h2>
            
            <div class="filter-group">
                <div class="filter-item">
                    <label>Khu vực (Area từ Excel)</label>
                    <select id="sel-area" onchange="filterData()"><option value="">-- Tất cả Area --</option></select>
                </div>
                <div class="filter-item">
                    <label>Tỉnh Thành (COUNTRY từ JSON)</label>
                    <select id="sel-province" onchange="filterData()"><option value="">-- Tất cả Tỉnh --</option></select>
                </div>
                <button id="btnRun" class="btn-primary" onclick="initLoadAndProcess()">🔄 Chạy Tổng Hợp</button>
            </div>
        </div>

        <div id="table-container">
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>Tỉnh / Thành Phố</th>
                        <th>Quận / Huyện</th>
                        <th>Phường / Xã</th>
                        <th class="num-right">Khách Trên Tuyến</th>
                        <th class="num-right">Khách Lên Đơn</th>
                        <th class="num-right">Doanh Số</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Nhấn nút "Chạy Tổng Hợp" để nạp dữ liệu từ hệ thống.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="map-panel">
        <div id="map"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://mrqldgycwovpbmzdeuyz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_itZfZBVw7bxE184tGh7x8A_0_r-QB5p'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'mappingdata';
    
    const FILE_ROUTE = 'tuyen.xlsx'; 
    const GEOJSON_FILE = 'gadm41_VNM_3.json'; 

    // Khởi tạo Map
    const map = L.map('map', { zoomControl: false }).setView([10.8231, 106.6297], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let masterGeoJSON = null; 
    let customerPoints = []; 
    let geoJsonLayer = null;

    // --- BƯỚC 1: NẠP VÀ PHÂN LOẠI DỮ LIỆU BAN ĐẦU ---
    async function initLoadAndProcess() {
        const btn = document.getElementById('btnRun');
        btn.disabled = true;
        try {
            // 1. Tải và xử lý file ranh giới GeoJSON từ Supabase
            if (!masterGeoJSON) {
                const { data: geoUrl } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrls([GEOJSON_FILE], 60);
                let resGeo = await fetch(geoUrl[0].signedUrl);
                masterGeoJSON = await resGeo.json();
                
                // Chuẩn hóa thuộc tính dựa trên logic phân cấp hành chính yêu cầu
                masterGeoJSON.features.forEach(f => {
                    let p = f.properties;
                    // Kiểm tra chuỗi khởi đầu bằng "VNM" để nhận diện cấp Phường/Xã
                    if (p.name && p.name.startsWith("VNM")) {
                        f.properties._level = "phuong_xa";
                        f.properties._province = p.COUNTRY;
                        f.properties._district = p.NAME_1;
                        f.properties._ward = p.NAME_2;
                    } else if (p.NAME_2 === "NA") {
                        f.properties._level = "quan_huyen";
                        f.properties._province = p.COUNTRY;
                        f.properties._district = p.NAME_1;
                        f.properties._ward = ""; // Cấp huyện không có phường xã cụ thể
                    } else {
                        f.properties._level = "khac";
                    }
                });

                // Đồng bộ danh sách Tỉnh Thành vào bộ lọc COUNTRY
                populateProvinceFilter();
            }

            // 2. Tải file Tuyến Excel từ Supabase để bóc tách Area & Tọa độ khách hàng
            const { data: excelUrl } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrls([FILE_ROUTE], 60);
            let resExcel = await fetch(excelUrl[0].signedUrl);
            let arrBuffer = await resExcel.arrayBuffer();
            let workbook = XLSX.read(arrBuffer, { type: 'array' });
            let sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

            processExcelData(sheetData);
            
            // 3. Thực hiện tính toán không gian
            runSpatialAnalysis();

        } catch (error) {
            console.error(error);
            alert("Lỗi hệ thống: " + error.message);
        } finally {
            btn.disabled = false;
        }
    }

    // Trích xuất danh sách tỉnh hành chính đưa vào thẻ select
    function populateProvinceFilter() {
        let provinces = [...new Set(masterGeoJSON.features.map(f => f.properties._province))].filter(Boolean).sort();
        const sel = document.getElementById('sel-province');
        sel.innerHTML = '<option value="">-- Tất cả Tỉnh --</option>';
        provinces.forEach(p => sel.innerHTML += `<option value="${p}">${p}</option>`);
    }

    // Xử lý file tuyến.xlsx để lấy dữ liệu tọa độ khách hàng và Area
    function processExcelData(sheetData) {
        customerPoints = [];
        let areaSet = new Set();

        sheetData.forEach((row, idx) => {
            if (idx === 0 || !row[5]) return; // Bỏ qua tiêu đề
            
            let area = row[24] ? row[24].toString().trim() : "Khác";
            let lat = parseFloat(row[22]);
            let lng = parseFloat(row[23]);
            let sales = parseFloat(row[25]) || 0; // Giả định cột 25 chứa thực đạt doanh số
            
            if (area) areaSet.add(area);

            if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
                customerPoints.push(turf.point([lng, lat], {
                    area: area,
                    sales: sales,
                    hasOrder: sales > 0
                }));
            }
        });

        // Đồng bộ danh sách Area vào bộ lọc hình khối
        const selArea = document.getElementById('sel-area');
        selArea.innerHTML = '<option value="">-- Tất cả Area --</option>';
        [...areaSet].sort().forEach(a => selArea.innerHTML += `<option value="${a}">${a}</option>`);
    }

    // --- BƯỚC 2: TÍNH TOÁN KHÔNG GIAN (POINT IN POLYGON) ---
    function runSpatialAnalysis() {
        if (!masterGeoJSON || customerPoints.length === 0) return;

        // Reset toàn bộ thông số tích lũy trên tất cả các Polygon vùng
        masterGeoJSON.features.forEach(f => {
            f.properties._onRoute = 0;
            f.properties._ordered = 0;
            f.properties._revenue = 0;
            f.properties._assignedArea = ""; 
        });

        // Chạy thuật toán đối chiếu không gian
        customerPoints.forEach(pt => {
            kmlGeoJSON.features.forEach(poly => {
                if (turf.booleanPointInPolygon(pt, poly)) {
                    poly.properties._onRoute += 1;
                    if (pt.properties.hasOrder) {
                        poly.properties._ordered += 1;
                        poly.properties._revenue += pt.properties.sales;
                    }
                    // Ghi nhận Area phân bổ theo vị trí rớt của Khách hàng
                    poly.properties._assignedArea = pt.properties.area;
                }
            });
        });

        filterData();
    }

    // --- BƯỚC 3: LỌC & HIỂN THỊ DỮ LIỆU THEO YÊU CẦU BỘ LỌC ---
    function filterData() {
        const selectedArea = document.getElementById('sel-area').value;
        const selectedProvince = document.getElementById('sel-province').value;

        // Lọc danh sách thuộc tính hiển thị lên Bảng Báo cáo (Hiển thị đầy đủ cả Huyện và Xã)
        let filteredFeatures = masterGeoJSON.features.filter(f => {
            let p = f.properties;
            if (p._onRoute === 0) return false;
            if (selectedArea && p._assignedArea !== selectedArea) return false;
            if (selectedProvince && p._province !== selectedProvince) return false;
            return true;
        });

        renderTable(filteredFeatures);

        // Bản đồ chỉ lấy dữ liệu Quận/Huyện để render lớp màu
        let mapFeatures = masterGeoJSON.features.filter(f => {
            let p = f.properties;
            if (p._level !== "quan_huyen") return false; // Chỉ hiển thị ranh giới Quận Huyện
            if (selectedProvince && p._province !== selectedProvince) return false;
            return true;
        });

        renderMap(mapFeatures);
    }

    // Render dữ liệu lên bảng (70% diện tích bên trái)
    function renderTable(features) {
        const tbody = document.getElementById('summary-body');
        tbody.innerHTML = '';

        if (features.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Không tìm thấy dữ liệu phù hợp điều kiện lọc.</td></tr>';
            return;
        }

        // Sắp xếp theo doanh số giảm dần
        let rowsData = features.map(f => f.properties).sort((a,b) => b._revenue - a._revenue);

        rowsData.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td style="color: var(--color-light-1);">${p._assignedArea || 'N/A'}</td>
                    <td>${p._province}</td>
                    <td style="font-weight: bold; color: var(--color-light-2);">${p._district}</td>
                    <td class="text-orange">${p._ward || '-'}</td>
                    <td class="num-right">${p._onRoute.toLocaleString()}</td>
                    <td class="num-right">${p._ordered.toLocaleString()}</td>
                    <td class="num-right text-green">${p._revenue.toLocaleString()} đ</td>
                </tr>
            `;
        });
    }

    // --- BƯỚC 4: RENDER BẢN ĐỒ CHỈ HIỂN THỊ QUẬN HUYỆN (30% DIỆN TÍCH) ---
    function mapColorScale(revenue) {
        return revenue > 50000000 ? '#7D3F20' : 
               revenue > 20000000 ? '#A86134' : 
               revenue > 5000000  ? '#D3885D' : 
               revenue > 0        ? '#E8B892' : 
                                    'transparent';
    }

    function renderMap(featuresList) {
        if (geoJsonLayer) { map.removeLayer(geoJsonLayer); }

        let displayCollection = turf.featureCollection(featuresList);

        geoJsonLayer = L.geoJSON(displayCollection, {
            style: function (feature) {
                return {
                    fillColor: mapColorScale(feature.properties._revenue),
                    weight: 1.5,
                    opacity: 1,
                    color: 'var(--border-color)',
                    fillOpacity: 0.75
                };
            },
            onEachFeature: function (feature, layer) {
                let p = feature.properties;
                layer.bindPopup(`
                    <div style="font-size:12px; line-height: 1.6;">
                        <b style="color:var(--color-light-1); font-size:14px;">Quận/Huyện: ${p._district}</b><br>
                        Tỉnh: <b>${p._province}</b><br>
                        <hr style="border-color:#4b5563; margin:5px 0;">
                        Khách trên tuyến: <b>${p._onRoute}</b><br>
                        Khách lên đơn: <b>${p._ordered}</b><br>
                        Doanh số vùng: <b style="color:#10B981;">${p._revenue.toLocaleString()} đ</b>
                    </div>
                `);
            }
        }).addTo(map);

        if (featuresList.length > 0) {
            let bbox = turf.bbox(displayCollection);
            map.fitBounds([[bbox[1], bbox[0]], [bbox[3], bbox[2]]], { padding: [10, 10] });
        }
    }
</script>
</body>
</html>
