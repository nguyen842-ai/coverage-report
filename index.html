<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Coverage & Doanh Số Theo Khu Vực</title>
    
    <!-- Leaflet & Turf.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        /* Bảng màu Dark Mode + Tone Ấm: #7D3F20, #A86134, #D3885D, #E8B892, #F9E3C9 */
        :root {
            --bg-dark: #1E2227;
            --bg-panel: #282C34;
            --color-primary: #7D3F20;
            --color-secondary: #A86134;
            --color-accent: #D3885D;
            --color-light-1: #E8B892;
            --color-light-2: #F9E3C9;
            --text-main: #E2E8F0;
            --text-muted: #9CA3AF;
            --border-color: #3F4451;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            font-size: 13px;
            overflow: hidden;
        }

        #app-container { display: flex; height: 100vh; width: 100%; }
        
        /* Bảng Báo Cáo (70%) */
        #report-panel { 
            width: 70%; height: 100%; 
            display: flex; flex-direction: column; 
            padding: 20px; box-sizing: border-box;
            background: var(--bg-dark);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header-section h2 { margin: 0; color: var(--color-light-1); font-size: 18px; }

        .toolbar-info {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-badge { font-weight: bold; color: var(--color-light-2); }

        .btn-primary { 
            padding: 10px 16px; background-color: var(--color-secondary); 
            color: var(--color-light-2); border: none; border-radius: 6px; 
            font-weight: bold; cursor: pointer; transition: background 0.3s; 
        }
        .btn-primary:hover { background-color: var(--color-primary); }
        .btn-primary:disabled { background-color: #4B5563; color: var(--text-muted); cursor: not-allowed; }

        #table-container { 
            flex-grow: 1; overflow-y: auto; 
            background: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
        
        th { 
            background-color: var(--color-primary); 
            color: var(--color-light-2); 
            position: sticky; top: 0; z-index: 2; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        tr:hover { background-color: rgba(255, 255, 255, 0.03); }

        .num-right { text-align: right; font-weight: bold; }
        .text-green { color: #10B981; }
        .text-orange { color: var(--color-accent); }

        /* Bản Đồ (30%) */
        #map-panel { 
            width: 30%; height: 100%; 
            border-left: 1px solid var(--border-color);
            position: relative;
        }

        #map { width: 100%; height: 100%; background: #1A1D24; }
        
        /* Custom Leaflet Popups */
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .leaflet-popup-tip { background: var(--bg-panel) !important; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 70% AREA: Báo Cáo Thống Kê -->
    <div id="report-panel">
        <div class="header-section">
            <h2>📊 BÁO CÁO ĐỘ PHỦ & DOANH SỐ (COVERAGE REPORT)</h2>
            <div class="toolbar-info">
                <div>Hệ thống: <span id="statusSystem" class="status-badge">Chờ xử lý...</span></div>
                <button id="btnRun" class="btn-primary" onclick="startAnalysis()">🔄 Chạy Tổng Hợp</button>
            </div>
        </div>

        <div id="table-container">
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>Tỉnh / Thành Phố</th>
                        <th>Quận / Huyện / Xã</th>
                        <th class="num-right">Khách Trên Tuyến</th>
                        <th class="num-right">Khách Lên Đơn</th>
                        <th class="num-right">Tổng Doanh Số</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Vui lòng nhấn nút "Chạy Tổng Hợp" để nạp dữ liệu từ Supabase
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 30% AREA: Bản Đồ trực quan -->
    <div id="map-panel">
        <div id="map"></div>
    </div>
</div>

<script>
    // --- CẤU HÌNH SUPABASE ---
    const SUPABASE_URL = 'https://mrqldgycwovpbmzdeuyz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_itZfZBVw7bxE184tGh7x8A_0_r-QB5p'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'mappingdata';
    const GEOJSON_FILE = 'gadm41_VNM_3.json'; // File JSON bạn vừa up lên

    // --- KHỞI TẠO BẢN ĐỒ (DARK THEME) ---
    const map = L.map('map', { zoomControl: false }).setView([10.8231, 106.6297], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let kmlGeoJSON = null; 
    let salesPoints = []; 
    let geoJsonLayer = null;

    function updateStatus(text, color = 'var(--color-light-2)') {
        const el = document.getElementById('statusSystem');
        el.innerText = text;
        el.style.color = color;
    }

    // --- LUỒNG XỬ LÝ CHÍNH ---
    async function startAnalysis() {
        document.getElementById('btnRun').disabled = true;
        try {
            // 1. Tải file Ranh giới tự động từ Supabase Storage
            updateStatus("⌛ Đang nạp bản đồ ranh giới...");
            if (!kmlGeoJSON) {
                const { data: urlData, error: urlErr } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrls([GEOJSON_FILE], 60);
                if (urlErr || !urlData) throw new Error("Không lấy được link file ranh giới.");
                
                let res = await fetch(urlData[0].signedUrl);
                kmlGeoJSON = await res.json();
            }

            // 2. Gọi API lấy dữ liệu Khách hàng & Doanh số (Thay thế bằng cấu trúc hàm Supabase thực tế của bạn)
            updateStatus("⌛ Đang tải dữ liệu doanh số...");
            const rawSalesData = await loadSalesFromSupabase();

            // 3. Convert dữ liệu khách hàng sang dạng Turf.js Points Collection
            salesPoints = [];
            rawSalesData.forEach(row => {
                if (row.lat && row.lng) {
                    salesPoints.push(turf.point([parseFloat(row.lng), parseFloat(row.lat)], {
                        sales: parseFloat(row.sales) || 0,
                        hasOrder: row.sales > 0 // Nếu doanh số > 0 được tính là lên đơn thành công
                    }));
                }
            });

            // 4. Tính toán Point-In-Polygon
            updateStatus("⌛ Đang tính toán không gian...");
            calculateCoverage();

            updateStatus("✅ Hoàn thành", "#10B981");
        } catch (error) {
            console.error(error);
            updateStatus("❌ Lỗi xử lý", "#EF4444");
            alert("Đã xảy ra lỗi: " + error.message);
        } finally {
            document.getElementById('btnRun').disabled = false;
        }
    }

    // --- HÀM TẢI DỮ LIỆU DOANH SỐ TỪ SUPABASE (SKELETON) ---
    async function loadSalesFromSupabase() {
        // [!] Chèn cấu trúc select dữ liệu thực tế từ table Supabase của bạn ở đây
        // Ví dụ: let { data } = await supabaseClient.from('sales').select('lat, lng, sales');
        
        // Dưới đây là mảng dữ liệu demo khớp với ranh giới GADM An Giang trong file của bạn
        return [
            { lat: 10.880, lng: 105.080, sales: 12500000 }, // Thuộc An Phú
            { lat: 10.790, lng: 105.120, sales: 0 },        // Thuộc An Phú (Có trên tuyến, ko đơn)
            { lat: 10.680, lng: 105.080, sales: 8400000 },  // Thuộc Châu Đốc
            { lat: 10.520, lng: 105.120, sales: 23500000 }  // Thuộc Châu Phú
        ];
    }

    // --- THUẬT TOÁN ĐỐI CHIẾU KHÔNG GIAN ---
    function calculateCoverage() {
        if (!kmlGeoJSON || salesPoints.length === 0) return;

        // Reset bộ đếm trên các Polygon ranh giới
        kmlGeoJSON.features.forEach(f => {
            f.properties.onRoute = 0;
            f.properties.ordered = 0;
            f.properties.revenue = 0;
            // Trích xuất Area (Nếu properties gốc của bạn không có trường area)
            f.properties.areaGroup = f.properties.area || "Miền Tây 1"; 
        });

        // Duyệt quét điểm rớt vào Đa giác
        salesPoints.forEach(pt => {
            kmlGeoJSON.features.forEach(poly => {
                if (turf.booleanPointInPolygon(pt, poly)) {
                    poly.properties.onRoute += 1;
                    if (pt.properties.hasOrder) {
                        poly.properties.ordered += 1;
                        poly.properties.revenue += pt.properties.sales;
                    }
                }
            });
        });

        renderReportTable();
        renderMapColors();
    }

    // --- HIỂN THỊ BẢNG BÁO CÁO (70% DIỆN TÍCH) ---
    function renderReportTable() {
        const tbody = document.getElementById('summary-body');
        tbody.innerHTML = '';

        // Chỉ hiển thị các vùng có phát sinh khách hàng trên tuyến
        let trackedRegions = kmlGeoJSON.features
            .map(f => f.properties)
            .filter(p => p.onRoute > 0)
            .sort((a, b) => b.revenue - a.totalSales);

        if (trackedRegions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Không tìm thấy khách hàng nào nằm trong ranh giới đa giác.</td></tr>';
            return;
        }

        trackedRegions.forEach(p => {
            // Hỗ trợ hiển thị linh động cho cả Polygon Huyện hoặc Xã (nếu có name_2)
            let regionName = (p.NAME_2 && p.NAME_2 !== 'NA') ? `${p.NAME_1} / ${p.NAME_2}` : p.NAME_1;

            tbody.innerHTML += `
                <tr>
                    <td style="color: var(--color-light-1); font-weight: 500;">${p.areaGroup}</td>
                    <td>${p.COUNTRY || 'N/A'}</td>
                    <td style="font-weight: bold; color: var(--color-light-2);">${regionName}</td>
                    <td class="num-right">${p.onRoute.toLocaleString()}</td>
                    <td class="num-right text-orange">${p.ordered.toLocaleString()}</td>
                    <td class="num-right text-green">${p.revenue.toLocaleString()} đ</td>
                </tr>
            `;
        });
    }

    // --- ĐỔ MÀU LÊN BẢN ĐỒ NHIỆT (30% DIỆN TÍCH) ---
    function opacityColor(revenue) {
        return revenue > 50000000 ? '#7D3F20' : 
               revenue > 20000000 ? '#A86134' : 
               revenue > 5000000  ? '#D3885D' : 
               revenue > 0        ? '#E8B892' : 
                                    'transparent'; 
    }

    function renderMapColors() {
        if (geoJsonLayer) { map.removeLayer(geoJsonLayer); }

        geoJsonLayer = L.geoJSON(kmlGeoJSON, {
            style: function (feature) {
                return {
                    fillColor: opacityColor(feature.properties.revenue),
                    weight: 1.5,
                    opacity: 1,
                    color: 'var(--border-color)', 
                    fillOpacity: 0.75
                };
            },
            onEachFeature: function (feature, layer) {
                let p = feature.properties;
                let loc = (p.NAME_2 && p.NAME_2 !== 'NA') ? `${p.NAME_1} - ${p.NAME_2}` : p.NAME_1;
                
                layer.bindPopup(`
                    <div style="font-size:12px; line-height: 1.6;">
                        <b style="color:var(--color-light-1); font-size:14px;">${loc}</b><br>
                        Tỉnh: <b>${p.COUNTRY}</b><br>
                        Khách trên tuyến: <b>${p.onRoute}</b><br>
                        Khách lên đơn: <b style="color:var(--color-accent);">${p.ordered}</b><br>
                        Doanh thu vùng: <b style="color:#10B981;">${p.revenue.toLocaleString()} đ</b>
                    </div>
                `);
            }
        }).addTo(map);

        // Auto focus zoom bản đồ vào khu vực có dữ liệu hành chính
        if (kmlGeoJSON.features.length > 0) {
            let bbox = turf.bbox(kmlGeoJSON);
            map.fitBounds([[bbox[1], bbox[0]], [bbox[3], bbox[2]]], { padding: [15, 15] });
        }
    }
</script>
</body>
</html>
