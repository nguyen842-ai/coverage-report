<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Coverage - Drilldown Tối Ưu</title>
    
    <!-- Thư viện chuyên dụng -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- NẾU BẠN CHƯA CÓ FILE DATA M7 Ở ĐÂY THÌ PHẢI THÊM VÀO NHÉ -->
    <!-- <script src="đường_dẫn_tới_file/dataM7.js"></script> -->

    <style>
        :root {
            --bg-dark: #1E2227;
            --bg-panel: #282C34;
            --color-primary: #7D3F20;
            --color-secondary: #A86134;
            --color-accent: #D3885D;
            --color-light-1: #E8B892;
            --color-light-2: #F9E3C9;
            --text-main: #E2E8F0;
            --text-muted: #9CA3AF;
            --border-color: #3F4451;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            font-size: 13px;
            overflow: hidden;
        }

        #app-container { display: flex; height: 100vh; width: 100%; }
        
        #report-panel { 
            width: 70%; height: 100%; 
            display: flex; flex-direction: column; 
            padding: 20px; box-sizing: border-box;
        }

        .header-section {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px; flex-wrap: wrap; gap: 15px;
        }

        .header-section h2 { margin: 0; color: var(--color-light-1); font-size: 18px; }

        .filter-group { display: flex; gap: 10px; align-items: center; }
        .filter-item { display: flex; flex-direction: column; gap: 4px; }
        .filter-item label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        select {
            background: var(--bg-panel); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 8px 12px;
            border-radius: 6px; outline: none; font-size: 13px;
        }

        .btn-primary { 
            padding: 10px 16px; background-color: var(--color-secondary); 
            color: var(--color-light-2); border: none; border-radius: 6px; 
            font-weight: bold; cursor: pointer; transition: background 0.3s;
            height: 36px; margin-top: 15px;
        }
        .btn-primary:hover { background-color: var(--color-primary); }
        .btn-primary:disabled { background-color: #4B5563; color: var(--text-muted); cursor: not-allowed; }

        #table-container { 
            flex-grow: 1; overflow-y: auto; background: var(--bg-panel);
            border-radius: 8px; border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
        
        th { 
            background-color: var(--color-primary); color: var(--color-light-2); 
            position: sticky; top: 0; z-index: 2; font-size: 11px; text-transform: uppercase;
        }

        .district-row { cursor: pointer; transition: background 0.2s; }
        .district-row:hover { background-color: rgba(255, 255, 255, 0.05); }
        .district-row .toggle-icon { display: inline-block; width: 16px; color: var(--color-accent); font-weight: bold; }
        
        .ward-row { display: none; background-color: #21252B; font-size: 12px; }
        .ward-row.show { display: table-row; }
        .ward-row td { border-bottom: 1px dashed #3F4451; color: #D1D5DB; }

        .num-right { text-align: right; font-weight: bold; }
        .text-green { color: #10B981; }
        .text-orange { color: var(--color-accent); }

        #map-panel { width: 30%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #1A1D24; }
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important; color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }
        .leaflet-popup-tip { background: var(--bg-panel) !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="report-panel">
        <div class="header-section">
            <h2>📊 BÁO CÁO COVERAGE - CẤP QUẬN HUYỆN</h2>
            
            <div class="filter-group">
                <div class="filter-item">
                    <label>Khu vực (Area)</label>
                    <select id="sel-area" onchange="filterData()"><option value="">-- Tất cả Area --</option></select>
                </div>
                <div class="filter-item">
                    <label>Tỉnh Thành</label>
                    <select id="sel-province" onchange="filterData()"><option value="">-- Tất cả Tỉnh --</option></select>
                </div>
                <button id="btnRun" class="btn-primary" onclick="initLoadAndProcess()">🔄 Nạp Dữ Liệu</button>
            </div>
        </div>

        <div id="table-container">
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>Tỉnh / Thành Phố</th>
                        <th>Quận / Huyện <span style="font-size: 10px; font-weight:normal;">(Click để xem Phường)</span></th>
                        <th>Phường / Xã</th>
                        <th class="num-right">Khách Trên Tuyến</th>
                        <th class="num-right">Khách Lên Đơn</th>
                        <th class="num-right">Doanh Số</th>
                    </tr>
                </thead>
                <tbody id="summary-body">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 40px;">
                            Nhấn nút "Nạp Dữ Liệu" để lấy thông tin.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="map-panel">
        <div id="map"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://mrqldgycwovpbmzdeuyz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_itZfZBVw7bxE184tGh7x8A_0_r-QB5p'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'mappingdata';
    
    const FILE_ROUTE = 'tuyen.xlsx'; 
    // Đảm bảo tên file này là file bạn đã filter từ Mapshaper
    const GEOJSON_FILE = 'gadm41_VNM_3.json'; 

    const map = L.map('map', { zoomControl: false }).setView([10.8231, 106.6297], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let wardFeatures = []; 
    let allProcessedDistricts = []; 
    let geoJsonLayer = null;

    async function initLoadAndProcess() {
        const btn = document.getElementById('btnRun');
        btn.innerHTML = "⌛ Đang nạp dữ liệu...";
        btn.disabled = true;
        
        setTimeout(async () => {
            try {
                if (wardFeatures.length === 0) {
                    const { data: geoUrl } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrls([GEOJSON_FILE], 60);
                    let resGeo = await fetch(geoUrl[0].signedUrl);
                    let masterGeoJSON = await resGeo.json();
                    
                    masterGeoJSON.features.forEach(f => {
                        f._bbox = turf.bbox(f); 
                        // Vì file đã lọc sạch, tất cả đều là Phường/Xã
                        wardFeatures.push(f);
                    });

                    populateProvinceFilter();
                }

                const { data: excelUrl } = await supabaseClient.storage.from(BUCKET_NAME).createSignedUrls([FILE_ROUTE], 60);
                let resExcel = await fetch(excelUrl[0].signedUrl);
                let arrBuffer = await resExcel.arrayBuffer();
                let workbook = XLSX.read(arrBuffer, { type: 'array' });
                let sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

                processExcelData(sheetData);

            } catch (error) {
                console.error(error);
                alert("Lỗi hệ thống: " + error.message);
            } finally {
                btn.innerHTML = "🔄 Nạp Dữ Liệu";
                btn.disabled = false;
            }
        }, 100);
    }

    function populateProvinceFilter() {
        // Sử dụng NAME_1 vì chuẩn GADM lưu Tỉnh ở cột này
        let provinces = [...new Set(wardFeatures.map(f => f.properties.NAME_1))].filter(Boolean).sort();
        const sel = document.getElementById('sel-province');
        sel.innerHTML = '<option value="">-- Tất cả Tỉnh --</option>';
        provinces.forEach(p => sel.innerHTML += `<option value="${p}">${p}</option>`);
    }

    function getCustomerSalesSummary(cusCode) {
        let totalSales = 0;
        let isOrdered = false;
        let targetArray = window.dbSalesM7 || window.dbSalesM6 || window.dbSalesM5 || [];
        
        // Dùng parseInt để lờ đi các số 0 ở đầu do Excel tự động xóa
        let cleanInputCode = parseInt(cusCode, 10);

        if (Array.isArray(targetArray) && !isNaN(cleanInputCode)) {
            targetArray.forEach(line => {
                if (line && line.cusCode) {
                    let cleanDbCode = parseInt(line.cusCode, 10);
                    if (cleanDbCode === cleanInputCode) {
                        totalSales += parseFloat(line.sales) || 0;
                        isOrdered = true;
                    }
                }
            });
        }
        return { sales: totalSales, isOrdered: isOrdered };
    }

    function processExcelData(sheetData) {
        let areaSet = new Set();
        let records = [];

        sheetData.forEach((row, idx) => {
            if (idx === 0 || !row[5]) return; 
            
            let area = row[24] ? row[24].toString().trim() : "Khác";
            let ma_kh = row[5] ? row[5].toString().trim() : "";
            let lat = parseFloat(row[22]);
            let lng = parseFloat(row[23]);
            
            if (area) areaSet.add(area);

            let salesSummary = getCustomerSalesSummary(ma_kh);
            let matchedWard = null;

            if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                let pt = turf.point([lng, lat]);

                for (let f of wardFeatures) {
                    const bbox = f._bbox;
                    if (lng >= bbox[0] && lng <= bbox[2] && lat >= bbox[1] && lat <= bbox[3]) {
                        if (turf.booleanPointInPolygon(pt, f)) {
                            matchedWard = f.properties;
                            break; 
                        }
                    }
                }
            }

            // Map lại chuẩn thuộc tính file GADM: NAME_1 (Tỉnh), NAME_2 (Quận), NAME_3 (Phường)
            if (matchedWard) {
                records.push({
                    cusCode: ma_kh,
                    area: area,
                    province: matchedWard.NAME_1 || "Chưa rõ", 
                    district: matchedWard.NAME_2 || "Chưa rõ",
                    ward: matchedWard.NAME_3 || matchedWard.VARNAME_3 || "Chưa rõ", 
                    sales: salesSummary.sales,
                    isOrdered: salesSummary.isOrdered
                });
            } else {
                records.push({
                    cusCode: ma_kh, area: area,
                    province: "Chưa rõ", district: "Chưa rõ", ward: "Chưa rõ",
                    sales: salesSummary.sales, isOrdered: salesSummary.isOrdered
                });
            }
        });

        const selArea = document.getElementById('sel-area');
        selArea.innerHTML = '<option value="">-- Tất cả Area --</option>';
        [...areaSet].sort().forEach(a => selArea.innerHTML += `<option value="${a}">${a}</option>`);

        allProcessedDistricts = aggregateHierarchicalRows(records);
        filterData();
    }

    function aggregateHierarchicalRows(records) {
        let districtGroups = {};
        
        records.forEach(r => {
            let distKey = `${r.area}|${r.province}|${r.district}`;
            
            if (!districtGroups[distKey]) {
                districtGroups[distKey] = {
                    area: r.area, province: r.province, district: r.district,
                    cusOnRouteSet: new Set(), cusOrderedSet: new Set(),
                    wards: {} 
                };
            }
            
            let wardKey = r.ward;
            if (!districtGroups[distKey].wards[wardKey]) {
                districtGroups[distKey].wards[wardKey] = {
                    wardName: r.ward,
                    cusOnRouteSet: new Set(), cusOrderedSet: new Set()
                };
            }

            districtGroups[distKey].cusOnRouteSet.add(r.cusCode);
            if (r.isOrdered) districtGroups[distKey].cusOrderedSet.add(r.cusCode);

            districtGroups[distKey].wards[wardKey].cusOnRouteSet.add(r.cusCode);
            if (r.isOrdered) districtGroups[distKey].wards[wardKey].cusOrderedSet.add(r.cusCode);
        });

        return Object.values(districtGroups).map(d => {
            let distRev = 0;
            d.cusOrderedSet.forEach(cus => distRev += getCustomerSalesSummary(cus).sales);
            
            let wardArr = Object.values(d.wards).map(w => {
                let wRev = 0;
                w.cusOrderedSet.forEach(cus => wRev += getCustomerSalesSummary(cus).sales);
                return {
                    wardName: w.wardName,
                    onRoute: w.cusOnRouteSet.size,
                    ordered: w.cusOrderedSet.size,
                    revenue: wRev
                }
            }).sort((a,b) => b.revenue - a.revenue);

            return {
                area: d.area, province: d.province, district: d.district,
                onRoute: d.cusOnRouteSet.size,
                ordered: d.cusOrderedSet.size,
                revenue: distRev,
                wardsData: wardArr 
            };
        });
    }

    function filterData() {
        const selectedArea = document.getElementById('sel-area').value;
        const selectedProvince = document.getElementById('sel-province').value;

        let displayTableData = allProcessedDistricts.filter(r => {
            if (selectedArea && r.area !== selectedArea) return false;
            if (selectedProvince && r.province !== selectedProvince) return false;
            return true;
        });
        renderTableRows(displayTableData);

        // Mượn lớp Phường/Xã để vẽ bản đồ nhưng đồng bộ số liệu hiển thị lên cấp Quận/Huyện
        let mapFeatures = wardFeatures.filter(f => {
            let p = f.properties;
            if (selectedProvince && p.NAME_1 !== selectedProvince) return false;
            
            let matchData = allProcessedDistricts.find(d => d.province === p.NAME_1 && d.district === p.NAME_2);
            p._mapOnRoute = matchData ? matchData.onRoute : 0;
            p._mapOrdered = matchData ? matchData.ordered : 0;
            p._mapRevenue = matchData ? matchData.revenue : 0;
            
            return true;
        });

        renderMapLayer(mapFeatures);
    }

    function toggleWards(districtId) {
        let wardRows = document.querySelectorAll(`.ward-row-${districtId}`);
        let icon = document.getElementById(`icon-${districtId}`);
        let isExpanding = icon.innerText === '[+]';
        
        icon.innerText = isExpanding ? '[-]' : '[+]';
        wardRows.forEach(row => {
            if (isExpanding) row.classList.add('show');
            else row.classList.remove('show');
        });
    }

    function renderTableRows(rowsData) {
        const tbody = document.getElementById('summary-body');
        tbody.innerHTML = '';

        if (rowsData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Không tìm thấy dữ liệu.</td></tr>';
            return;
        }

        rowsData.sort((a, b) => b.revenue - a.revenue);

        rowsData.forEach((p, index) => {
            let distId = `dist_${index}`; 

            tbody.innerHTML += `
                <tr class="district-row" onclick="toggleWards('${distId}')">
                    <td style="color: var(--color-light-1);">${p.area}</td>
                    <td>${p.province}</td>
                    <td style="font-weight: bold; color: var(--color-light-2);">
                        <span class="toggle-icon" id="icon-${distId}">[+]</span> ${p.district}
                    </td>
                    <td>-- Tổng Hợp --</td>
                    <td class="num-right">${p.onRoute.toLocaleString()}</td>
                    <td class="num-right text-orange">${p.ordered.toLocaleString()}</td>
                    <td class="num-right text-green">${p.revenue.toLocaleString()} đ</td>
                </tr>
            `;

            p.wardsData.forEach(w => {
                tbody.innerHTML += `
                    <tr class="ward-row ward-row-${distId}">
                        <td></td>
                        <td></td>
                        <td style="text-align: right; color:#6B7280;">↳</td>
                        <td style="color: var(--color-light-2);">${w.wardName}</td>
                        <td class="num-right" style="color: #9CA3AF;">${w.onRoute.toLocaleString()}</td>
                        <td class="num-right" style="color: #D3885D;">${w.ordered.toLocaleString()}</td>
                        <td class="num-right" style="color: #10B981;">${w.revenue.toLocaleString()} đ</td>
                    </tr>
                `;
            });
        });
    }

    function mapColorScale(revenue) {
        return revenue > 50000000 ? '#7D3F20' : 
               revenue > 20000000 ? '#A86134' : 
               revenue > 5000000  ? '#D3885D' : 
               revenue > 0        ? '#E8B892' : 
                                    'transparent';
    }

    function renderMapLayer(featuresList) {
        if (geoJsonLayer) { map.removeLayer(geoJsonLayer); }

        let displayCollection = turf.featureCollection(featuresList);

        geoJsonLayer = L.geoJSON(displayCollection, {
            style: function (feature) {
                return {
                    fillColor: mapColorScale(feature.properties._mapRevenue),
                    weight: 1.5,
                    opacity: 1,
                    color: 'var(--border-color)',
                    fillOpacity: 0.75
                };
            },
            onEachFeature: function (feature, layer) {
                let p = feature.properties;
                layer.bindPopup(`
                    <div style="font-size:12px; line-height: 1.6;">
                        <b style="color:var(--color-light-1); font-size:14px;">Quận/Huyện: ${p.NAME_2}</b><br>
                        Tỉnh: <b>${p.NAME_1}</b><br>
                        <hr style="border-color:#4b5563; margin:5px 0;">
                        Khách trên tuyến: <b>${p._mapOnRoute}</b><br>
                        Khách lên đơn: <b>${p._mapOrdered}</b><br>
                        Doanh số vùng: <b style="color:#10B981;">${p._mapRevenue.toLocaleString()} đ</b>
                    </div>
                `);
            }
        }).addTo(map);

        if (featuresList.length > 0) {
            let bbox = turf.bbox(displayCollection);
            map.fitBounds([[bbox[1], bbox[0]], [bbox[3], bbox[2]]], { padding: [10, 10] });
        }
    }
</script>
</body>
</html>
